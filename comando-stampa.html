<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="instant-v4.css"><title>WITH YOU INSTANT PRINT</title></head><body><main id="app"><header><h1>WITH YOU<br><span>INSTANT PRINT</span></h1><button id="settingsButton" class="outline" aria-label="Impostazioni">Impostazioni</button></header><section class="studio"><div class="view"><video id="camera" autoplay muted playsinline hidden></video><img id="preview" alt="Anteprima foto con cornice" hidden><div id="placeholder"><span class="star">✦</span></div><img id="frameGuide" alt="" hidden><img id="logoGuide" alt="" hidden></div><div class="controls"><button id="start">APRI FOTOCAMERA</button><button id="snap" hidden disabled>SCATTA FOTO</button><button id="print" hidden disabled>STAMPA</button><button id="next" class="white" hidden>NUOVA FOTO</button><button id="flip" class="outline" hidden>Cambia fotocamera</button><p id="status" role="status" aria-live="polite"></p></div></section>
<dialog id="settings"><form method="dialog"><header><h2>Il tuo stile.</h2><button class="outline">Chiudi</button></header></form><p>Cornice e logo restano su questo dispositivo. Le foto no.</p><label>Cornice PNG trasparente · consigliata 1200 × 1800<input id="frameFile" type="file" accept="image/png"></label><button id="removeFrame" class="outline">Rimuovi cornice</button><label>Logo PNG trasparente<input id="logoFile" type="file" accept="image/png"></label><button id="removeLogo" class="outline">Rimuovi logo</button><label>Larghezza logo <input id="logoWidth" type="range" min="10" max="70" value="28"><output id="widthValue">28%</output></label><label>Posizione logo<select id="logoPosition"><option value="bottom">In basso al centro</option><option value="top">In alto al centro</option></select></label><p class="note">Cornice a pieno formato sopra la foto, logo sopra la cornice. Foto centrata e ritagliata in 2:3. Mantieni trasparente l’area della foto.</p><p id="settingsStatus" role="status"></p></dialog><dialog id="auth"><form id="authForm"><h2>Impostazioni</h2><label>Password<input id="password" type="password" inputmode="numeric" autocomplete="off" required></label><p id="authError" role="alert"></p><div class="authActions"><button type="submit">Accedi</button><button type="button" id="cancelAuth" class="outline">Annulla</button></div></form></dialog></main><img id="printImage" hidden alt=""><script src="instant-pdf-v4.js" defer></script><script src="instant-v4.js" defer></script></body></html>
